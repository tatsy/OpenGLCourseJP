name: Ubuntu CI

on:
  push:
    branches:
      - main
      - dev

env:
  BUILD_TYPE: Release
  GNU_CC: gcc
  GNU_CXX: g++
  LLVM_CC: clang
  LLVM_CXX: clang++

jobs:
  ubuntu:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.MY_PAT }}

      - name: Install OpenGL envs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libglu1-mesa-dev \
            mesa-common-dev \
            libxmu-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev

      - name: Install GLFW3
        run: |
          git clone https://github.com/glfw/glfw.git          
          cd glfw && git switch -c 3.4
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          cmake --build build --config Release --target install

      - name: Install GLM
        run: |
          git clone https://github.com/g-truc/glm.git
          cd glm && git switch -c 1.0.1
          sudo cp -R glm /usr/local/include

      - name: CMake Build
        env:
          C_COMPILER: ${{ matrix.compiler }}
        run: |
          if [ "$C_COMPILER" = "gcc" ]; then
            cmake -S $GITHUB_WORKSPACE \
              -B ${{ runner.workspace }}/build \
              -G "Ninja" \
              -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
              -DCMAKE_C_COMPILER=$GNU_CC \
              -DCMAKE_CXX_COMPILER=$GNU_CXX
          fi
          if [ "$C_COMPILER" = "clang" ]; then
            cmake -S $GITHUB_WORKSPACE \
              -B ${{ runner.workspace }}/build \
              -G "Ninja" \
              -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
              -DCMAKE_C_COMPILER=$LLVM_CC \
              -DCMAKE_CXX_COMPILER=$LLVM_CXX
          fi
          cmake --build ${{ runner.workspace }}/build --config $BUILD_TYPE
