name: Windows CI

on:
  push:
    branches:
      - main
      - dev

env:
  BUILD_TYPE: Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.MY_PAT }}

      - name: Install GLFW3
        run: |
          git clone https://github.com/glfw/glfw.git -b 3.4 --depth 1
          cd glfw
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -D CMAKE_BUILD_TYPE=${BUILD_TYPE} `
            -D CMAKE_INSTALL_PREFIX="C:/Program Files/glfw3/" `
            -D GLFW_BUILD_EXAMPLES=OFF `
            -D GLFW_BUILD_TESTS=OFF `
            -D GLFW_BUILD_DOCS=OFF
          cmake --build build --config "$env:BUILD_TYPE" --target INSTALL

      - name: Install GLM
        run: |
          git clone https://github.com/g-truc/glm.git
          cd glm && git switch -c 1.0.1
          cd .. && Copy-Item glm "C:/Program Files/glm/" -Recurse

      - name: CMake Build
        run: |
          cmake -S "$env:GITHUB_WORKSPACE" `
            -B ${{ runner.workspace }}/build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -D GLM_DIR="C:/Program Files/glm" `
            -D GLFW3_DIR="C:/Program Files/glfw3"
          cmake --build ${{ runner.workspace }}/build --config "$env:BUILD_TYPE"
