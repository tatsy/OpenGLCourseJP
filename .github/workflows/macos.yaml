name: MacOS CI

on:
  push:
    branches:
      - main
      - dev

env:
  BUILD_TYPE: Release
  GNU_CC: gcc
  GNU_CXX: g++
  LLVM_CC: clang
  LLVM_CXX: clang++

jobs:
  macos:
    runs-on: macos-latest

    strategy:
      matrix:
        compiler:
          - gcc
          - clang

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.MY_PAT }}

      - name: Install LLVM Clang
        if: ${{ matrix.compiler == 'clang' }}
        run: |
          brew install llvm

      - name: Install GLFW3
        run: |
          brew install glfw3

      - name: Install GLM
        run: |
          brew install glm

      - name: CMake Build
        env:
          C_COMPILER: ${{ matrix.compiler }}
        run: |
          if [ "$C_COMPILER" = "gcc" ]; then
            cmake -S $GITHUB_WORKSPACE \
              -B ${{ runner.workspace }}/build \
              -G "Ninja" \
              -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
              -DCMAKE_C_COMPILER=$GNU_CC \
              -DCMAKE_CXX_COMPILER=$GNU_CXX
          fi
          if [ "$C_COMPILER" = "clang" ]; then
            cmake -S $GITHUB_WORKSPACE \
              -B ${{ runner.workspace }}/build \
              -G "Ninja" \
              -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
              -DCMAKE_C_COMPILER=$LLVM_CC \
              -DCMAKE_CXX_COMPILER=$LLVM_CXX
          fi
          cmake --build ${{ runner.workspace }}/build --config $BUILD_TYPE
